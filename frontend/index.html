<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Menu — a DigitalMov Product. Create a beautiful digital menu for your restaurant, cafe or bakery. Pick a template, customize every detail and publish in minutes."
    />
    <title>Digital Menu — Your Restaurant Menu. Your Brand. Your Rules.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Vazirmatn:wght@300;400;600;700&family=Noto+Naskh+Arabic:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Poppins:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('menucraft-lang');
          if (saved === 'ar' || saved === 'ku') { document.documentElement.dir = 'rtl'; document.documentElement.lang = saved; }
          else if (saved === 'en') { document.documentElement.dir = 'ltr'; document.documentElement.lang = 'en'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
